[project]
name = "task-api"
version = "0.1.0"
description = "API CRUD de tareas con FastAPI y SQLite"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.158.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
